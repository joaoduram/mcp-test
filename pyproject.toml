[project]
name = "mcp-server-teste"
version = "0.1.0"
description = "MCP server básico de teste"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.urls]
Repository = "https://github.com/joaoduram/mcp-test"

[project.scripts]
mcp-server-teste = "mcp_server_teste.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_teste"]
